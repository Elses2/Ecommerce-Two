# =============================================================================
# docker-compose.prod.yml — Plantilla de despliegue para el servidor (spec §21)
# =============================================================================
# Uso en el servidor:
#   1. Crear .env con las variables (ver .env.prod.example)
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. docker compose -f docker-compose.prod.yml run --rm tienda npm run seed
#   4. Para actualizar: docker compose pull && docker compose up -d
# =============================================================================

services:
  # ── Aplicación ────────────────────────────────────────────────────────────
  tienda:
    # IMPORTANTE: reemplazar <usuario> y <repo> con los valores reales
    image: ghcr.io/<usuario>/<repo>:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Redis del carrito (spec §24); la clave se define una sola vez en .env.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - tienda-data:/data
    # Sin ports: el servidor está detrás de Cloudflare Tunnel, no expone puertos

  # ── Redis (carrito, spec §24) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    # Sin ports: Redis solo es alcanzable desde la red interna de Compose.

  # ── Tunel Cloudflare ──────────────────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: .env

volumes:
  tienda-data:
    # Volumen nombrado para persistencia de la base de datos SQLite
    # Los datos sobreviven a docker compose down y up
  redis-data:
    # Volumen nombrado para persistencia del carrito (appendonly, spec §24)
