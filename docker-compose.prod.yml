name: ecommerce-two

# Plantilla de producción (spec §21.5).
# Los secretos NO van acá: se leen del archivo .env que está junto a este compose.
#   JWT_SECRET      -> openssl rand -hex 48   (mínimo 32 caracteres)
#   REDIS_PASSWORD  -> openssl rand -hex 24   (usá hex: otros símbolos rompen REDIS_URL)

services:
  # ── Aplicación ────────────────────────────────────────────────────────────
  tienda:
    image: ghcr.io/elses2/ecommerce-two:latest
    restart: unless-stopped
    ports:
      - "18480:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_PATH: /data/shop.db
      JWT_SECRET: ${JWT_SECRET:?definí JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      REDIS_URL: redis://:${REDIS_PASSWORD:?definí REDIS_PASSWORD en .env}@redis:6379
      FALLBACK_IMAGE_URL: ${FALLBACK_IMAGE_URL:-https://placehold.co/600x600?text=Sin+imagen}
      # true SOLO si servís por HTTPS (ver spec §16 y §22.2)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CSP_UPGRADE_INSECURE: ${CSP_UPGRADE_INSECURE:-false}
    volumes:
      - /mnt/nas/EcommerceTwo/data:/data # SQLite (el contenedor corre como usuario `node`, uid 1000)
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis (carrito, spec §24) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - /mnt/nas/EcommerceTwo/redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
