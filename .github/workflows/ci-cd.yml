# =============================================================================
# CI/CD para MiEcommerce (spec §21)
# =============================================================================
# Flujo:
#   Pull Request dev → main   ──► job ci (solo build + tests)
#   merge del PR a main        ──► job ci + job publish (build imagen + push a ghcr.io)
#   Push a dev                 ──► job ci (solo build + tests, sin publish)
#
# Nota: en este proyecto nadie hace push directo a main.
# El trabajo vive en dev y llega a main únicamente mediante PRs.
# =============================================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

# ── Permisos mínimos ─────────────────────────────────────────────────────────
# El job publish eleva a packages:write solo cuando es necesario.
permissions:
  contents: read

jobs:
  # ── Job 1: CI (build + tests) ────────────────────────────────────────────
  ci:
    name: Build & test
    runs-on: ubuntu-latest

    # Redis para el carrito (spec §24): los tests de carrito lo necesitan.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/15
      JWT_SECRET: secreto-solo-para-ci-0123456789abcdef0123

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run checkout tests (T1–T7, spec §19.6)
        run: npm run test:checkout

      - name: Run middleware characterization tests (M1–M18, spec §22)
        run: npm run test:middlewares

      - name: Run auth tests (A1–A8, spec §23)
        run: npm run test:auth

      - name: Run cart tests (C1–C6, spec §24)
        run: npm run test:cart

  # ── Job 2: Publish a ghcr.io (solo en push a main) ──────────────────────
  publish:
    name: Build & push Docker image
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name (ghcr.io requires lowercase)
        id: meta
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          echo "IMAGE_NAME=${OWNER,,}/${REPO,,}" >> "$GITHUB_OUTPUT"
          echo "TAGS=latest,${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.IMAGE_NAME }}:latest
            ghcr.io/${{ steps.meta.outputs.IMAGE_NAME }}:${{ github.sha }}

# ── Nota para servidor ARM ───────────────────────────────────────────────────
# Si el servidor de producción es ARM (p. ej. Raspberry Pi), agregar:
#   platforms: linux/arm64
# al step docker/build-push-action. Implica emulación QEMU en el runner GitHub
# (más lento) o un runner self-hosted ARM nativo. Por ahora no se activa.
